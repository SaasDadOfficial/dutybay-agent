<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>DutyBay Agent</title>
  <link rel="icon" type="image/x-icon" href="../assets/logo.ico" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <img src="../assets/logo.ico" class="brand-logo" />
        <span>DutyBay Agent</span>
      </div>
      <button class="logout-link" id="logoutBtn">Logout</button>
    </div>

    <div class="user-block">
      <div class="user-name" id="userLabel">Md Omor Faruk</div>
      <div class="user-role">Employee</div>
    </div>

    <span id="statusPill" class="status-pill status-idle">
      <span class="dot"></span>
      <span id="statusText">Idle</span>
    </span>

    <div class="card timer-card">
      <div class="timer" id="timer">00:00:00</div>
      <div class="timer-labels">
        <span>HH</span><span>:</span><span>MM</span><span>:</span><span>SS</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Worked Today</div>
        <div class="stat-value" id="workedToday">0m</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Remaining</div>
        <div class="stat-value" id="remaining">--</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary btn-full" id="startBtn">Start</button>
      <div class="actions-split">
        <button class="btn-warn" id="pauseBtn">
          <span class="icon">&#10073;&#10073;</span> Pause Work
        </button>
        <button class="btn-secondary" id="resumeBtn">
          <span class="icon">&#9654;</span> Resume
        </button>
      </div>
      <button class="btn-danger btn-full" id="finishBtn">
        <span class="icon">&#9632;</span> Finish Work Today
      </button>
    </div>

    <div class="error" id="err"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
